<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asistan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Kişisel Asistan</title>
<style>
:root{
  --bg:#000; --card:#141417; --card2:#1d1d22; --line:rgba(255,255,255,.07);
  --text:#f5f5f7; --mut:#8e8e98; --acc:#ff2d6f; --ok:#30d158;
  --r:22px; --dial-h:178px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none}
body{padding-top:env(safe-area-inset-top)}
main{max-width:520px;margin:0 auto;padding:6px 14px calc(var(--dial-h) + env(safe-area-inset-bottom) + 20px)}

/* üst bar */
.top{display:flex;align-items:flex-end;justify-content:space-between;max-width:520px;margin:0 auto;padding:14px 16px 4px}
.top .tarih{color:var(--mut);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.top h1{margin:2px 0 0;font-size:30px;font-weight:800;letter-spacing:-.6px}
.top .sag{display:flex;gap:8px;align-items:center}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:var(--card2);color:var(--text);font-size:16px;cursor:pointer;display:grid;place-items:center;position:relative}
.ib .dot{position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;border:2px solid #000;background:var(--mut)}
.dot.ok{background:var(--ok)}.dot.bekle{background:#ffd60a}.dot.hata{background:#ff453a}
.ib.on{background:var(--text);color:#000}

/* kartlar */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;position:relative;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ch h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px}
.ch small{color:var(--mut);font-size:12px;font-weight:600}
.mut{color:var(--mut)}.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grow{flex:1;min-width:0}

/* hero: halkalar + 2x2 */
.hero{display:grid;grid-template-columns:1.18fr 1fr;gap:10px;margin-top:8px}
.ringcard{background:var(--card);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer}
.rings{width:100%;max-width:210px;aspect-ratio:1}
.rings circle{fill:none;stroke-linecap:round}
.rings .fg{transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.ringmid{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center}
.ringmid b{font-size:24px;font-weight:800;letter-spacing:-.5px;display:block}
.ringmid span{font-size:9px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.mini4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--card);border-radius:18px;padding:11px;display:flex;flex-direction:column;justify-content:space-between;min-height:86px;cursor:pointer;position:relative;overflow:hidden}
.mini .ic{font-size:18px}
.mini b{display:block;font-size:17px;font-weight:800;letter-spacing:-.4px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;color:var(--mut);font-weight:600}
.mini::after{content:"";position:absolute;right:-20px;top:-20px;width:60px;height:60px;border-radius:50%;background:var(--g,#fff);opacity:.12;filter:blur(8px)}

/* hedef şeridi */
.strip{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px;scroll-snap-type:x mandatory}
.strip::-webkit-scrollbar{display:none}
.pill{flex:none;background:var(--card);border-radius:18px;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px;cursor:pointer;scroll-snap-align:start;border:1px solid transparent;transition:transform .15s}
.pill:active{transform:scale(.96)}
.pill.tam{border-color:var(--c)}
.pill svg{width:38px;height:38px;flex:none}
.pill b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap}
.pill span{font-size:11.5px;color:var(--mut);font-weight:600}

/* sıradaki */
.next{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.next:first-of-type{border-top:0;padding-top:0}
.emo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:color-mix(in srgb,var(--c) 18%,transparent)}
.go{border:0;border-radius:99px;padding:9px 15px;font-weight:800;font-size:13px;cursor:pointer;background:var(--c);color:#000}
.seg{display:flex;background:var(--card2);border-radius:11px;padding:2px;gap:2px}
.seg button{border:0;background:none;color:var(--mut);font-size:12px;font-weight:600;padding:6px 10px;border-radius:9px;cursor:pointer}
.seg button.on{background:#3a3a42;color:var(--text)}

/* grafik */
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bstack{flex:1;width:100%;max-width:30px;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden;background:var(--card2)}
.bstack i{display:block;width:100%;transition:height 1s cubic-bezier(.2,.8,.2,1)}
.bcol span{font-size:11px;color:var(--mut);font-weight:600}
.bcol.bugun span{color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px}
.legend div{font-size:12px;display:flex;align-items:center;gap:5px;color:var(--mut)}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend b{color:var(--text);font-weight:600}

/* başarımlar */
.rozetler{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.rozetler::-webkit-scrollbar{display:none}
.rozet{flex:none;width:78px;text-align:center}
.rozet .r{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 30% 30%,#3a3a44,#1a1a1f);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.rozet.acik .r{background:radial-gradient(circle at 30% 30%,var(--c),color-mix(in srgb,var(--c) 30%,#000));box-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent)}
.rozet:not(.acik) .r{filter:grayscale(1);opacity:.45}
.rozet span{font-size:10.5px;color:var(--mut);font-weight:600;line-height:1.2;display:block}
.bigstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.bigstat div{background:var(--card2);border-radius:14px;padding:10px}
.bigstat b{font-size:20px;font-weight:800;display:block;letter-spacing:-.4px}
.bigstat span{font-size:11px;color:var(--mut);font-weight:600}

/* takvim */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{padding:8px 0 6px;border-radius:14px;cursor:pointer}
.wd .n{font-size:11px;color:var(--mut);font-weight:600}
.wd .d{font-size:17px;font-weight:700;margin:3px 0 4px}
.wd.bugun{background:var(--text);color:#000}.wd.bugun .n{color:#555}
.wd .dots{display:flex;justify-content:center;gap:2px;min-height:6px;flex-wrap:wrap;padding:0 4px}
.wd .dots i{width:5px;height:5px;border-radius:50%}
.evt{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--card2);font-size:13.5px}

/* ısı haritası */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--card2)}
.heat i.l1{background:#3b0f20}.heat i.l2{background:#7a1838}.heat i.l3{background:#c4204f}.heat i.l4{background:#ff2d6f;box-shadow:0 0 6px #ff2d6f88}

/* para */
.money b.k{font-size:30px;font-weight:800;letter-spacing:-.8px}
.track{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin:10px 0 4px;display:flex}
.track i{display:block;height:100%;transition:width 1s}
.katlar{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px}
.katlar div{font-size:12px;display:flex;justify-content:space-between;color:var(--mut)}
.katlar b{color:var(--text)}
.btn{border:0;border-radius:14px;padding:13px;font-weight:800;font-size:15px;cursor:pointer;width:100%;background:var(--text);color:#000}
.btn.ghost{background:var(--card2);color:var(--text)}

/* kelime kartı */
.flip{perspective:900px;cursor:pointer}
.flip .in{position:relative;min-height:96px;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .yz{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center}
.flip .ar{transform:rotateY(180deg)}
.flip .w{font-size:26px;font-weight:800;letter-spacing:-.5px}

/* düzenleme modu */
.editbar{display:none;gap:6px;position:absolute;top:12px;right:12px;z-index:2}
.duzenle .editbar{display:flex}
.duzenle .card,.duzenle .hero{animation:wob .35s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-.25deg)}to{transform:rotate(.25deg)}}
.eb{width:32px;height:32px;border-radius:50%;border:0;background:#2c2c33;color:var(--text);font-size:14px;cursor:pointer}
.gizli-list{display:none}.duzenle .gizli-list{display:block}

/* giriş animasyonları */
.ilk .card,.ilk .hero,.ilk .strip{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* döner menü */
.dial{position:fixed;left:0;right:0;bottom:0;height:calc(var(--dial-h) + env(safe-area-inset-bottom));z-index:6;touch-action:none;overflow:hidden;pointer-events:none}
.dial .fade{position:absolute;inset:0;background:linear-gradient(to top,#000 55%,rgba(0,0,0,.85) 75%,transparent);pointer-events:none}
.dial .arc{position:absolute;left:50%;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 50% 0%,#1c1c22,#0b0b0e 60%);box-shadow:0 -1px 0 rgba(255,255,255,.12),0 -20px 60px rgba(255,45,111,.08);pointer-events:auto}
.dial .item{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;display:grid;place-items:center;font-size:25px;pointer-events:auto;cursor:pointer;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 95%,#fff),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 6px 18px color-mix(in srgb,var(--c) 35%,transparent);will-change:transform}
.dial .lbl{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));text-align:center;font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--mut);pointer-events:none;text-transform:uppercase}

/* alt pencere */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:10;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{background:#1a1a1f;border-radius:26px 26px 0 0;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet-bg.on .sheet{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:#3a3a42;margin:0 auto 14px}
.sheet h3{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.4px}
label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px 13px;font-size:16px;font-family:inherit}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--card2);color:var(--text);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--c,var(--text));color:#000}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:#2a2a30;padding:11px 18px;border-radius:99px;z-index:20;transition:transform .35s cubic-bezier(.2,.8,.2,1);font-size:14px;font-weight:600}
.toast.on{transform:translate(-50%,0)}
.empty{color:var(--mut);text-align:center;padding:10px 0;font-size:14px}
</style>
</head>
<body class="ilk">
<div class="top">
  <div><div class="tarih" id="tarih"></div><h1 id="selam">Merhaba</h1></div>
  <div class="sag">
    <button class="ib" onclick="sync(true)" title="Eşitle">⟳<span class="dot" id="syncdot"></span></button>
    <button class="ib" id="editbtn" onclick="UI.duzenle()" title="Ana ekranı düzenle">✎</button>
  </div>
</div>
<main id="main"></main>
<div class="dial" id="dial"><div class="fade"></div><div class="arc" id="arc"></div><div class="lbl" id="dlbl">Ana Ekran</div></div>
<div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
