<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12121c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asistan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Kişisel Asistan</title>
<style>
:root{
  --bg:#12121c; --card:#1c1c2a; --card2:#252536; --line:#2f2f44;
  --text:#ececf4; --mut:#9a9ab3; --acc:#ff8a5c; --acc2:#7c5cff; --ok:#3ecf8e; --warn:#ffc552; --bad:#ff5c7a;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:14px 14px 20px}
header{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto;padding:14px 16px 0}
header h1{font-size:22px;margin:0;letter-spacing:-.3px}
header .sub{color:var(--mut);font-size:13px}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer}
.sync{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.ok{background:var(--ok)}.dot.bekle{background:var(--warn)}.dot.hata{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.card h2{font-size:16px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{color:var(--mut);font-weight:400;font-size:12px}
.hero{background:linear-gradient(135deg,#2a1f3d,#1c1c2a 60%);}
.mut{color:var(--mut)} .small{font-size:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1a1020;font-weight:600}
.btn{background:var(--acc);color:#1a1020;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;width:100%}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.sm{width:auto;padding:8px 12px;font-size:13px}
.btn.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.oneri{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.oneri:first-of-type{border-top:0}
.emo{font-size:24px;width:40px;height:40px;display:grid;place-items:center;background:var(--card2);border-radius:12px;flex:none}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:99px}
.bar.ok>i{background:var(--ok)}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.list .it:first-child{border-top:0}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(18,18,28,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--text)} nav button.on b{filter:none;opacity:1}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet h3{margin:0 0 12px;font-size:18px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;font-size:16px;font-family:inherit}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-120px);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:20;transition:.3s;font-size:14px}
.toast.on{transform:translateX(-50%) translateY(0)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:8px;border-radius:9px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);font-weight:600}
.empty{color:var(--mut);text-align:center;padding:14px 0;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;text-align:center;border-top:1px solid var(--line)}
th{color:var(--mut);font-weight:500}
td:first-child,th:first-child{text-align:left}
a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <div><h1 id="baslik">Bugün</h1><div class="sub" id="tarih"></div></div>
  <div class="row"><div class="sync"><span class="dot" id="syncdot"></span><span id="synctxt"></span></div><button class="iconbtn" onclick="App.sync(true)" title="Eşitle">⟳</button><button class="iconbtn" onclick="App.ayarlar()" title="Ayarlar">⚙︎</button></div>
</header>
<main id="main"></main>
<nav><div class="in">
  <button data-t="bugun" class="on"><b>☀️</b>Bugün</button>
  <button data-t="hedefler"><b>🎯</b>Hedefler</button>
  <button data-t="para"><b>💳</b>Para</button>
  <button data-t="kisiler"><b>🎁</b>Kişiler</button>
  <button data-t="hafta"><b>📊</b>Hafta</button>
</div></nav>
<div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
